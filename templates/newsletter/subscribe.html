{% extends 'base.html' %}
{% load static i18n %}

{% block title %}{% trans "Newsletter" %} - SekhmetKarnark{% endblock %}

{% block content %}
<main class="pt-32 pb-section-padding">
    <div class="max-w-lg mx-auto px-margin-mobile md:px-margin-desktop text-center">
        <span class="material-symbols-outlined text-6xl text-secondary mb-6">mail</span>
        <h1 class="font-headline-md text-headline-md text-primary mb-4">{% trans "Restez connecté" %}</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant mb-8">{% trans "Recevez nos dernières découvertes botaniques et conseils exclusifs." %}</p>
        <form class="flex flex-col sm:flex-row gap-4" method="POST">
            {% csrf_token %}
            <input class="flex-1 bg-transparent border-b border-outline-variant py-3 px-0 font-ui-label text-ui-label focus:border-primary transition-colors" type="email" name="email" placeholder="{% trans 'Votre email' %}" required>
            <button class="bg-primary text-on-primary px-8 py-3 font-label-caps text-label-caps uppercase tracking-widest hover:bg-surface-tint transition-colors" type="submit">{% trans "S'inscrire" %}</button>
        </form>
    </div>
</main>
{% endblock %}
