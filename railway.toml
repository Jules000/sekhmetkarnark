[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "web"
startCommand = "python manage.py migrate --noinput --settings=config.settings.production && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 2 --timeout 120"

[[services]]
name = "worker"
startCommand = "celery -A config worker -l info --concurrency 2"

[[services]]
name = "beat"
startCommand = "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
